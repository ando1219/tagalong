<!doctype html>
<title>凑伴</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&family=ZCOOL+KuaiLe&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16231d; --ink-soft:#57685e;
    --mist:#f1f4ee; --mist-dim:#e6e9e0;
    --coral:#ff5b3c; --coral-ink:#c23d22; --coral-soft:#ffe6df;
    --trail:#1e6f63; --trail-soft:#e2efe9;
    --sand:#d9cdb2; --sand-line:rgba(22,35,29,0.14);
    --paper:#fbfaf6;
    --gold:#e0912e; --gold-soft:#fbead0;
    --shadow:0 1px 2px rgba(22,35,29,.06), 0 8px 24px -12px rgba(22,35,29,.18);
    --shadow-lg:0 12px 40px -14px rgba(22,35,29,.35);
    --r-card:18px; --r-chip:999px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef2ea; --ink-soft:#9fb0a4;
      --mist:#101712; --mist-dim:#182019;
      --coral:#ff8264; --coral-ink:#ffb199; --coral-soft:#2c1811;
      --trail:#5fc2ae; --trail-soft:#123028;
      --sand:#4a4433; --sand-line:rgba(238,242,234,0.14);
      --paper:#171f19;
      --gold:#f0b35c; --gold-soft:#2e2210;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 28px -14px rgba(0,0,0,.6);
      --shadow-lg:0 18px 50px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef2ea; --ink-soft:#9fb0a4;
    --mist:#101712; --mist-dim:#182019;
    --coral:#ff8264; --coral-ink:#ffb199; --coral-soft:#2c1811;
    --trail:#5fc2ae; --trail-soft:#123028;
    --sand:#4a4433; --sand-line:rgba(238,242,234,0.14);
    --paper:#171f19;
    --gold:#f0b35c; --gold-soft:#2e2210;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 28px -14px rgba(0,0,0,.6);
    --shadow-lg:0 18px 50px -16px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--mist); color:var(--ink);
    font-family:'Noto Sans SC',"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.55;
    padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit; color:inherit;}
  [hidden]{display:none!important;}
  img{max-width:100%;}
  .stamp{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  h1,h2,h3,h4{margin:0; text-wrap:balance;}
  p{margin:0;}
  .wrap{max-width:1120px; margin-inline:auto; padding-inline:20px;}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--mist) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--sand-line);
    padding-top:env(safe-area-inset-top,0px);
  }
  .headbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding-block:12px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:36px;height:36px;border-radius:11px; background:var(--coral); color:#fff5f1;
    display:grid; place-items:center; font-family:'ZCOOL KuaiLe',sans-serif; font-size:18px;
    box-shadow:var(--shadow); flex:none;
  }
  .brand-name{font-family:'ZCOOL KuaiLe',sans-serif; font-size:20px;}
  .brand-sub{font-size:11px; color:var(--ink-soft); margin-top:-1px;}

  .tabs{display:flex; gap:4px; background:var(--paper); border:1px solid var(--sand-line); padding:4px; border-radius:var(--r-chip); box-shadow:var(--shadow);}
  .tab-btn{
    border:none; background:transparent; cursor:pointer; border-radius:var(--r-chip);
    padding:8px 16px; font-size:13.5px; font-weight:700; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .tab-btn.active{background:var(--coral); color:#fff;}
  .tab-btn .count{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; background:rgba(0,0,0,.12);
    padding:1px 6px; border-radius:8px;
  }
  .tab-btn.active .count{background:rgba(255,255,255,.28);}

  .profile-chip{
    display:flex; align-items:center; gap:8px; cursor:pointer; border:1px solid var(--sand-line);
    background:var(--paper); border-radius:var(--r-chip); padding:5px 12px 5px 5px; box-shadow:var(--shadow);
  }
  .avatar{
    width:28px;height:28px;border-radius:50%; display:grid; place-items:center;
    font-size:11px; font-weight:700; color:#fff; flex:none;
  }
  .profile-chip .lv{font-size:11px; color:var(--ink-soft);}
  .profile-chip .lv b{color:var(--ink); font-weight:700;}

  @media (max-width:760px){
    .headbar{flex-wrap:wrap;}
    .tabs{order:3; width:100%; justify-content:space-between;}
    .tab-btn{flex:1; justify-content:center;}
  }

  main{padding-block:26px 60px;}

  /* ---------- section titles ---------- */
  .panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .panel-head h2{font-size:21px; font-weight:800;}
  .panel-head p{font-size:13px; color:var(--ink-soft); margin-top:4px;}

  /* ---------- filter bar ---------- */
  .filter-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:20px;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    border:1px solid var(--sand-line); background:var(--paper); border-radius:var(--r-chip);
    padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px;
  }
  .chip.active{background:var(--trail); color:#eafff8; border-color:var(--trail);}
  .search-box{
    display:flex; align-items:center; gap:8px; border:1px solid var(--sand-line); background:var(--paper);
    border-radius:var(--r-chip); padding:7px 14px; margin-left:auto; min-width:180px;
  }
  .search-box input{border:none; background:transparent; outline:none; font-size:13px; width:100%;}
  select.sortsel{
    border:1px solid var(--sand-line); background:var(--paper); border-radius:var(--r-chip);
    padding:7px 12px; font-size:12.5px; font-weight:600;
  }

  /* ---------- feed grid ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:16px;}
  .empty{
    border:1px dashed var(--sand-line); border-radius:var(--r-card); padding:40px 20px; text-align:center;
    color:var(--ink-soft); font-size:13.5px; grid-column:1/-1;
  }

  .card{
    background:var(--paper); border:1px solid var(--sand-line); border-radius:var(--r-card);
    box-shadow:var(--shadow); padding:18px; cursor:pointer; display:flex; flex-direction:column; gap:12px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
  .card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .cat-tag{font-size:10.5px; font-weight:700; color:var(--trail); background:var(--trail-soft); padding:3px 9px; border-radius:7px;}
  .badge{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:7px; white-space:nowrap;}
  .badge.open{background:var(--sand); color:var(--ink-soft);}
  .badge.ready{background:var(--coral-soft); color:var(--coral-ink);}
  .badge.full{background:var(--gold-soft); color:var(--gold);}
  .badge.done{background:var(--trail-soft); color:var(--trail);}
  .card h3{font-size:16px; font-weight:700; line-height:1.35;}
  .card .meta-row{display:flex; flex-wrap:wrap; gap:7px 14px; font-size:11.5px; color:var(--ink-soft);}
  .card .meta-row span{display:flex; align-items:center; gap:4px;}
  .progress{height:6px; border-radius:4px; background:var(--mist-dim); overflow:hidden;}
  .progress i{display:block; height:100%; background:var(--coral); border-radius:4px;}
  .card .bottom{display:flex; justify-content:space-between; align-items:center;}
  .price{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--coral-ink); font-size:14px;}
  .avatars{display:flex;}
  .av-sm{width:22px;height:22px;border-radius:50%; border:2px solid var(--paper); margin-left:-7px; display:grid; place-items:center; font-size:9px; font-weight:700; color:#fff;}
  .av-sm:first-child{margin-left:0;}

  /* ---------- buttons ---------- */
  .btn{
    border:none; cursor:pointer; border-radius:var(--r-chip); padding:10px 18px; font-weight:700; font-size:13.5px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn.primary{background:var(--coral); color:#fff;}
  .btn.primary:disabled{background:var(--sand); color:var(--ink-soft); cursor:not-allowed;}
  .btn.ghost{background:transparent; border:1px solid var(--sand-line); color:var(--ink);}
  .btn.trail{background:var(--trail); color:#eafff8;}
  .btn.sm{padding:6px 13px; font-size:12px;}
  .btn.block{width:100%;}
  .btn.danger{background:transparent; color:var(--coral-ink); border:1px solid var(--coral-soft);}

  /* ---------- create form ---------- */
  .form-shell{max-width:640px; background:var(--paper); border:1px solid var(--sand-line); border-radius:var(--r-card); padding:26px; box-shadow:var(--shadow);}
  .f-row{display:grid; gap:6px; margin-bottom:16px;}
  .f-row.two{grid-template-columns:1fr 1fr; gap:14px;}
  .f-row label{font-size:12.5px; font-weight:700; color:var(--ink-soft);}
  .f-row input, .f-row select, .f-row textarea{
    border:1px solid var(--sand-line); background:var(--mist); border-radius:10px; padding:10px 12px; font-size:14px; width:100%;
  }
  .f-row textarea{resize:vertical; min-height:64px;}
  .f-hint{font-size:11.5px; color:var(--ink-soft);}
  .review-toggle{display:flex; gap:10px;}
  .review-opt{
    flex:1; border:1px solid var(--sand-line); border-radius:12px; padding:10px 12px; cursor:pointer; font-size:12.5px;
  }
  .review-opt.selected{border-color:var(--trail); background:var(--trail-soft);}
  .review-opt b{display:block; font-size:13px; margin-bottom:2px;}

  /* ---------- mine ---------- */
  .mine-group{margin-bottom:34px;}
  .mine-group h3{font-size:15px; font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .mine-item{
    background:var(--paper); border:1px solid var(--sand-line); border-radius:var(--r-card); margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow);
  }
  .mine-head{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:15px 18px; cursor:pointer;}
  .mine-head .ttl{font-size:14.5px; font-weight:700;}
  .mine-head .sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .chev{transition:transform .15s ease; color:var(--ink-soft); flex:none;}
  .mine-item.open .chev{transform:rotate(180deg);}
  .mine-body{padding:0 18px 18px; display:none; flex-direction:column; gap:16px;}
  .mine-item.open .mine-body{display:flex;}

  .pending-row{display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--sand-line); border-radius:12px; padding:10px 12px; background:var(--mist);}
  .pending-row .note{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .pending-actions{display:flex; gap:6px;}

  .pin-card{
    background:linear-gradient(135deg,var(--trail),#123c34); color:#eafff8; border-radius:14px; padding:14px 16px; font-size:12px;
  }
  .pin-card .h{font-weight:700; font-size:13.5px; margin-bottom:8px; display:flex; justify-content:space-between;}
  .pin-card .r{display:flex; justify-content:space-between; padding-block:2px; opacity:.92;}

  .expense-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .expense-table th{text-align:left; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; padding-bottom:6px; font-weight:700;}
  .expense-table td{padding:7px 0; border-top:1px solid var(--sand-line);}
  .paid-toggle{
    border:1px solid var(--sand-line); border-radius:var(--r-chip); padding:3px 10px; font-size:11px; cursor:pointer; font-weight:700;
  }
  .paid-toggle.yes{background:var(--trail-soft); color:var(--trail); border-color:transparent;}
  .expense-add{display:grid; grid-template-columns:1.4fr 1fr 1fr auto; gap:8px;}
  .expense-add input,.expense-add select{border:1px solid var(--sand-line); border-radius:9px; padding:8px 9px; background:var(--mist); font-size:12.5px;}

  .footprint-strip{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px;}
  .fp-card{background:var(--paper); border:1px solid var(--sand-line); border-radius:14px; padding:12px; box-shadow:var(--shadow);}
  .fp-photo{aspect-ratio:4/3; border-radius:10px; background:repeating-linear-gradient(135deg,var(--trail-soft),var(--trail-soft) 8px,var(--mist-dim) 8px,var(--mist-dim) 16px); margin-bottom:8px;}
  .fp-card .t{font-size:12.5px; font-weight:700;}
  .fp-card .c{font-size:11px; color:var(--ink-soft); margin-top:2px;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,14,11,.5); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center; z-index:100; padding:0;
  }
  @media (min-width:640px){ .overlay{align-items:center; padding:20px;} }
  .modal{
    background:var(--paper); width:100%; max-width:520px; max-height:92vh; overflow-y:auto;
    border-radius:22px 22px 0 0; box-shadow:var(--shadow-lg); padding:22px;
  }
  @media (min-width:640px){ .modal{border-radius:22px;} }
  .modal-close{position:sticky; top:0; float:right; background:var(--mist); border:none; width:30px;height:30px; border-radius:50%; cursor:pointer; font-size:15px; color:var(--ink-soft); margin-bottom:8px;}
  .modal h3{font-size:19px; font-weight:800; margin-bottom:4px;}
  .modal .sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin:16px 0;}
  .detail-field label{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:3px;}
  .detail-field div{font-family:'JetBrains Mono',monospace; font-size:13.5px; font-weight:600;}
  .participant-list{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
  .p-pill{display:flex; align-items:center; gap:6px; border:1px solid var(--sand-line); border-radius:var(--r-chip); padding:4px 10px 4px 4px; font-size:12px;}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,140%); z-index:200;
    background:var(--ink); color:var(--mist); padding:12px 20px; border-radius:var(--r-chip);
    font-size:13px; font-weight:600; box-shadow:var(--shadow-lg); transition:transform .25s ease;
    max-width:90vw; text-align:center;
  }
  #toast.show{transform:translate(-50%,0);}

  footer{border-top:1px solid var(--sand-line); margin-top:20px; padding-block:20px; font-size:12px; color:var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}
</style>

<header>
  <div class="wrap headbar">
    <div class="brand">
      <div class="brand-mark stamp">凑</div>
      <div>
        <div class="brand-name">凑伴</div>
        <div class="brand-sub">周末去哪儿，先找人一起去</div>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="feed" onclick="App.switchTab('feed')">拼场广场</button>
      <button class="tab-btn" data-tab="create" onclick="App.switchTab('create')">发起拼场</button>
      <button class="tab-btn" data-tab="mine" onclick="App.switchTab('mine')">我的拼场 <span class="count" id="mineCount">0</span></button>
    </div>
    <div class="profile-chip" onclick="App.openProfile()">
      <div class="avatar" style="background:var(--coral);">我</div>
      <div class="lv">Lv.<b id="lvNum">1</b> 探索者</div>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ============ FEED ============ -->
  <section id="panel-feed">
    <div class="panel-head">
      <div><h2>拼场广场</h2><p>按类型、距离、人均预算筛选附近的拼场，点一张卡看详情、申请加入。</p></div>
    </div>
    <div class="filter-bar">
      <div class="chip-row" id="catChips"></div>
      <select class="sortsel" id="sortSel" onchange="App.render()">
        <option value="new">最新发起</option>
        <option value="near">距离最近</option>
        <option value="cheap">人均最低</option>
      </select>
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="搜索活动、地点…" oninput="App.render()">
      </div>
    </div>
    <div class="grid" id="feedGrid"></div>
  </section>

  <!-- ============ CREATE ============ -->
  <section id="panel-create" hidden>
    <div class="panel-head"><div><h2>发起拼场</h2><p>把一个念头变成大家能看到、能加入的具体入口。</p></div></div>
    <form class="form-shell" id="createForm" onsubmit="return App.handleCreate(event)">
      <div class="f-row">
        <label>活动名称</label>
        <input name="title" placeholder="例如：中山公园手作市集 + 老洋房漫步" required>
      </div>
      <div class="f-row two">
        <div>
          <label>活动类型</label>
          <select name="category" required>
            <option value="骑行">骑行</option>
            <option value="市集">市集</option>
            <option value="徒步">徒步</option>
            <option value="摄影">摄影</option>
            <option value="咖啡">咖啡漫游</option>
            <option value="露营">露营</option>
          </select>
        </div>
        <div>
          <label>集合时间</label>
          <input name="time" placeholder="本周六 09:30" required>
        </div>
      </div>
      <div class="f-row">
        <label>集合地点</label>
        <input name="meet" placeholder="地铁站 / 具体路口" required>
      </div>
      <div class="f-row two">
        <div>
          <label>最少成团人数</label>
          <input name="minCap" type="number" min="2" max="20" value="3" required>
        </div>
        <div>
          <label>人数上限</label>
          <input name="maxCap" type="number" min="2" max="20" value="6" required>
        </div>
      </div>
      <div class="f-row two">
        <div>
          <label>人均预算下限（¥）</label>
          <input name="budgetMin" type="number" min="0" value="40" required>
        </div>
        <div>
          <label>人均预算上限（¥）</label>
          <input name="budgetMax" type="number" min="0" value="80" required>
        </div>
      </div>
      <div class="f-row">
        <label>审核方式</label>
        <div class="review-toggle">
          <label class="review-opt selected" data-val="auto">
            <input type="radio" name="reviewMode" value="auto" checked style="display:none">
            <b>自动通过</b><span class="f-hint">申请即加入，快速成团</span>
          </label>
          <label class="review-opt" data-val="manual">
            <input type="radio" name="reviewMode" value="manual" style="display:none">
            <b>发起人审核</b><span class="f-hint">你来确认每一位同行者</span>
          </label>
        </div>
      </div>
      <div class="f-row">
        <label>备注（可选）</label>
        <textarea name="note" placeholder="装备要求、雨天备选方案…"></textarea>
      </div>
      <button class="btn primary block" type="submit">生成拼场卡 →</button>
    </form>
  </section>

  <!-- ============ MINE ============ -->
  <section id="panel-mine" hidden>
    <div class="panel-head"><div><h2>我的拼场</h2><p>管理你发起的拼场、查看已加入的行程，结束后一键 AA 分账。</p></div></div>

    <div class="mine-group">
      <h3>我发起的 <span class="count mono" id="createdCount" style="background:var(--sand-line); padding:1px 7px; border-radius:8px; font-size:11px;">0</span></h3>
      <div id="createdList"></div>
    </div>
    <div class="mine-group">
      <h3>我加入的 <span class="count mono" id="joinedCount" style="background:var(--sand-line); padding:1px 7px; border-radius:8px; font-size:11px;">0</span></h3>
      <div id="joinedList"></div>
    </div>
    <div class="mine-group">
      <h3>我的探索足迹</h3>
      <div class="footprint-strip" id="footprintStrip"></div>
    </div>
  </section>

  <footer>
    <div><span class="stamp">凑伴</span> · 周末城市探索指南 · 组队功能原型</div>
    <div>数据保存在本浏览器（localStorage），仅你可见 · 刷新不丢失</div>
  </footer>
</main>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var CATS = ["骑行","市集","徒步","摄影","咖啡","露营"];
  var AVATAR_COLORS = {"我":"#ff5b3c","阿汤":"#1e6f63","小敏":"#e8a73b","阿辰":"#7b6fd6","小桐":"#3f9dd6",
    "小周":"#d6588f","阿杰":"#5b8c3f","林林":"#c9862b","夏夏":"#c25b8f","阿乐":"#2f8f7c","阿雅":"#8f6f2f"};
  function avColor(n){ return AVATAR_COLORS[n] || "#7b6fd6"; }
  function initials(n){ return n ? n.slice(-1) : "?"; }
  function uid(){ return "l" + Math.random().toString(36).slice(2,9); }
  function fmtMoney(a,b){ return "¥" + a + "–" + b; }

  var KEY = "coubang_state_v1";

  function seed(){
    return {
      lv: 2,
      footprints: [
        {title:"东湖绿道 · 傍晚骑行", caption:"和三个骑友一路吹着风到江边，日落时刚好到终点，超值。", withNames:["阿汤","小敏"]}
      ],
      listings: [
        {
          id:"l1", creator:"阿汤", title:"外滩晨骑 + 老码头市集", category:"骑行", time:"本周六 09:30",
          meet:"南京东路地铁站2号口", minCap:4, maxCap:6, budgetMin:80, budgetMax:120, reviewMode:"manual",
          weather:"阴转多云 21°C", distance:1.8, note:"骑行头盔现场可借，雨天备选老码头室内市集。",
          participants:[{name:"阿汤",role:"creator"},{name:"小敏"},{name:"阿辰"},{name:"小桐"}],
          pending:[], waitlist:[], expenses:[], paid:{}, done:false
        },
        {
          id:"l2", creator:"小周", title:"南头古城手作市集淘货", category:"市集", time:"本周日 10:00",
          meet:"南头古城北门", minCap:2, maxCap:4, budgetMin:40, budgetMax:60, reviewMode:"auto",
          weather:"晴 26°C", distance:3.2, note:"主打陶艺和扎染摊位，逛完可以顺路喝咖啡。",
          participants:[{name:"小周",role:"creator"}],
          pending:[], waitlist:[], expenses:[], paid:{}, done:false
        },
        {
          id:"l3", creator:"阿杰", title:"梧桐山徒步看日出", category:"徒步", time:"本周六 05:30",
          meet:"梧桐山地铁站", minCap:4, maxCap:6, budgetMin:30, budgetMax:50, reviewMode:"manual",
          weather:"晴 18°C", distance:6.5, note:"建议带手电和外套，山顶风大。",
          participants:[{name:"阿杰",role:"creator"},{name:"小雅"},{name:"阿凯"},{name:"小北"},{name:"阿萌"},{name:"阿雅"}],
          pending:[], waitlist:[{name:"小惠",note:"经常夜爬，体力没问题！"}], expenses:[], paid:{}, done:false
        },
        {
          id:"l4", creator:"我", title:"老街巷弄咖啡馆漫游", category:"咖啡", time:"下周日 14:00",
          meet:"中山路老街入口", minCap:3, maxCap:4, budgetMin:50, budgetMax:60, reviewMode:"manual",
          weather:"多云 23°C", distance:0, note:"想找三家有意思的独立咖啡馆坐一坐，顺便拍照。",
          participants:[{name:"我",role:"creator"}],
          pending:[{name:"夏夏",note:"超喜欢老建筑和咖啡，想一起逛逛！"},{name:"阿乐",note:"摄影爱好者，可以帮忙拍照～"}],
          waitlist:[], expenses:[], paid:{}, done:false
        }
      ]
    };
  }

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    var s = seed();
    save(s);
    return s;
  }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }

  var state = load();
  var ui = { tab:"feed", cat:"全部", openMine:{} };

  function approvedCount(l){ return l.participants.length; }
  function statusOf(l){
    if(l.done) return "done";
    var c = approvedCount(l);
    if(c >= l.maxCap) return "full";
    if(c >= l.minCap) return "ready";
    return "open";
  }
  function statusLabel(s){
    return {open:"征集中", ready:"已成团", full:"已满员", done:"已完成"}[s];
  }

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function persistAndRender(){ save(state); render(); }

  /* ---------------- render ---------------- */
  function render(){
    renderTabs();
    renderCatChips();
    renderFeed();
    renderMine();
    document.getElementById('lvNum').textContent = state.lv;
  }

  function renderTabs(){
    document.querySelectorAll('.tab-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.tab === ui.tab);
    });
    document.getElementById('panel-feed').hidden = ui.tab !== 'feed';
    document.getElementById('panel-create').hidden = ui.tab !== 'create';
    document.getElementById('panel-mine').hidden = ui.tab !== 'mine';
    var mineTotal = state.listings.filter(byMe).length + state.listings.filter(joinedNotMine).length;
    document.getElementById('mineCount').textContent = mineTotal;
  }

  function renderCatChips(){
    var el = document.getElementById('catChips');
    var chips = ["全部"].concat(CATS);
    el.innerHTML = chips.map(function(c){
      return '<button class="chip'+(ui.cat===c?' active':'')+'" onclick="App.setCat(\''+c+'\')">'+c+'</button>';
    }).join('');
  }

  function renderFeed(){
    var q = (document.getElementById('searchInput').value || "").trim().toLowerCase();
    var sort = document.getElementById('sortSel').value;
    var list = state.listings.filter(function(l){
      if(ui.cat !== "全部" && l.category !== ui.cat) return false;
      if(q && !(l.title.toLowerCase().indexOf(q)>-1 || l.meet.toLowerCase().indexOf(q)>-1)) return false;
      return true;
    });
    if(sort==="near") list = list.slice().sort(function(a,b){ return a.distance-b.distance; });
    else if(sort==="cheap") list = list.slice().sort(function(a,b){ return a.budgetMin-b.budgetMin; });
    else list = list.slice().reverse();

    var grid = document.getElementById('feedGrid');
    if(!list.length){
      grid.innerHTML = '<div class="empty">没有符合条件的拼场，换个筛选试试，或者<a href="#" onclick="App.switchTab(\'create\');return false;" style="color:var(--coral-ink); font-weight:700;">自己发起一个</a>。</div>';
      return;
    }
    grid.innerHTML = list.map(function(l){
      var s = statusOf(l);
      var pct = Math.min(100, Math.round(approvedCount(l)/l.maxCap*100));
      var avs = l.participants.slice(0,4).map(function(p){
        return '<div class="av-sm" style="background:'+avColor(p.name)+'">'+initials(p.name)+'</div>';
      }).join('');
      return '<div class="card" onclick="App.openListing(\''+l.id+'\')">'+
        '<div class="top"><span class="cat-tag">'+l.category+'</span><span class="badge '+s+'">'+
          (s==='full'? '已满 · 候补开放' : approvedCount(l)+'/'+l.maxCap+'人 · '+statusLabel(s))+'</span></div>'+
        '<h3>'+l.title+'</h3>'+
        '<div class="meta-row">'+
          '<span>🕐 '+l.time+'</span>'+
          '<span>📍 距你 '+(l.distance>0? l.distance+'km' : '同校') +'</span>'+
        '</div>'+
        '<div class="progress"><i style="width:'+pct+'%"></i></div>'+
        '<div class="bottom"><span class="price mono">'+fmtMoney(l.budgetMin,l.budgetMax)+'</span><div class="avatars">'+avs+'</div></div>'+
      '</div>';
    }).join('');
  }

  function byMe(l){ return l.creator === "我"; }
  function joinedNotMine(l){ return l.creator!=="我" && l.participants.some(function(p){return p.name==="我";}); }

  function renderMine(){
    var created = state.listings.filter(byMe);
    var joined = state.listings.filter(joinedNotMine);
    document.getElementById('createdCount').textContent = created.length;
    document.getElementById('joinedCount').textContent = joined.length;

    document.getElementById('createdList').innerHTML = created.length
      ? created.map(function(l){ return mineItemHtml(l, true); }).join('')
      : '<div class="empty" style="border-radius:14px;">还没有发起过拼场 · <a href="#" onclick="App.switchTab(\'create\');return false;" style="color:var(--coral-ink); font-weight:700;">去发起一个</a></div>';

    document.getElementById('joinedList').innerHTML = joined.length
      ? joined.map(function(l){ return mineItemHtml(l, false); }).join('')
      : '<div class="empty" style="border-radius:14px;">还没有加入任何拼场 · 去广场看看吧</div>';

    var fp = state.footprints.slice().reverse();
    document.getElementById('footprintStrip').innerHTML = fp.length ? fp.map(function(f){
      return '<div class="fp-card"><div class="fp-photo"></div><div class="t">'+f.title+'</div>'+
        '<div class="c">与 '+f.withNames.join('、')+' 同行</div></div>';
    }).join('') : '<div class="empty" style="border-radius:14px;">完成第一次拼场活动后，足迹会出现在这里。</div>';
  }

  function mineItemHtml(l, isCreator){
    var s = statusOf(l);
    var open = ui.openMine[l.id];
    var unlocked = (s==='ready' || s==='full' || s==='done');
    var body = "";

    if(isCreator && l.pending.length){
      body += '<div><div class="f-hint" style="margin-bottom:8px; font-weight:700; color:var(--ink);">待审核申请（'+l.pending.length+'）</div>' +
        l.pending.map(function(p,i){
          return '<div class="pending-row" style="margin-bottom:8px;">'+
            '<div><b style="font-size:13px;">'+p.name+'</b><div class="note">'+p.note+'</div></div>'+
            '<div class="pending-actions">'+
              '<button class="btn sm trail" onclick="event.stopPropagation();App.approve(\''+l.id+'\','+i+')">通过</button>'+
              '<button class="btn sm danger" onclick="event.stopPropagation();App.reject(\''+l.id+'\','+i+')">婉拒</button>'+
            '</div></div>';
        }).join('') + '</div>';
    }

    body += '<div><div class="f-hint" style="margin-bottom:8px; font-weight:700; color:var(--ink);">同行伙伴（'+approvedCount(l)+'/'+l.maxCap+'）</div>'+
      '<div class="participant-list">' + l.participants.map(function(p){
        return '<div class="p-pill"><span class="av-sm" style="background:'+avColor(p.name)+'; margin-left:0;">'+initials(p.name)+'</span>'+p.name+(p.role==='creator'?' · 发起人':'')+'</div>';
      }).join('') + '</div></div>';

    if(unlocked){
      body += '<div class="pin-card"><div class="h"><span>📌 已置顶行程</span><span>'+l.weather+'</span></div>'+
        '<div class="r"><span>集合</span><span>'+l.time+' · '+l.meet+'</span></div>'+
        '<div class="r"><span>备注</span><span>'+ (l.note||'—') +'</span></div></div>';

      body += renderExpenseBlock(l);

      if(!l.done){
        body += '<button class="btn trail block" onclick="event.stopPropagation();App.completeListing(\''+l.id+'\')">标记完成并打卡 →</button>';
      } else {
        body += '<div class="f-hint">✓ 已完成，足迹已记录到你的探索档案</div>';
      }
    } else if(isCreator) {
      body += '<div class="f-hint">还差 '+(l.minCap-approvedCount(l))+' 人达到最少成团人数，达到后可解锁行程卡与 AA 分账。</div>';
    }

    return '<div class="mine-item'+(open?' open':'')+'" id="mine-'+l.id+'">'+
      '<div class="mine-head" onclick="App.toggleMine(\''+l.id+'\')">'+
        '<div><div class="ttl">'+l.title+'</div><div class="sub">'+l.time+' · '+statusLabel(s)+(isCreator?' · 你是发起人':'')+'</div></div>'+
        '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>'+
      '</div>'+
      '<div class="mine-body">'+body+'</div>'+
    '</div>';
  }

  function renderExpenseBlock(l){
    var people = l.participants.map(function(p){return p.name;});
    var total = l.expenses.reduce(function(a,e){return a+Number(e.amount);},0);
    var share = people.length ? (total/people.length) : 0;
    var rows = people.map(function(name){
      var isPaid = !!l.paid[name];
      return '<tr><td>'+name+'</td><td class="mono">¥'+share.toFixed(1)+'</td><td>'+
        '<button class="paid-toggle'+(isPaid?' yes':'')+'" onclick="event.stopPropagation();App.togglePaid(\''+l.id+'\',\''+name+'\')">'+(isPaid?'已支付 ✓':'待支付')+'</button>'+
      '</td></tr>';
    }).join('');
    var items = l.expenses.map(function(e){
      return '<tr><td>'+e.item+'</td><td class="mono">¥'+e.amount+'</td><td class="f-hint">'+e.payer+' 垫付</td></tr>';
    }).join('');

    return '<div>'+
      '<div class="f-hint" style="margin-bottom:8px; font-weight:700; color:var(--ink);">AA 分账 · 合计 <span class="mono">¥'+total.toFixed(1)+'</span></div>'+
      (l.expenses.length ? '<table class="expense-table" style="margin-bottom:10px;"><tbody>'+items+'</tbody></table>' : '<div class="f-hint" style="margin-bottom:10px;">还没有账目，先记一笔吧。</div>')+
      '<div class="expense-add" onclick="event.stopPropagation();">'+
        '<input placeholder="项目，如：门票" id="exp-item-'+l.id+'">'+
        '<input placeholder="金额" type="number" id="exp-amt-'+l.id+'">'+
        '<select id="exp-payer-'+l.id+'">'+ people.map(function(n){return '<option value="'+n+'">'+n+' 垫付</option>';}).join('') +'</select>'+
        '<button class="btn sm primary" onclick="App.addExpense(\''+l.id+'\')">记账</button>'+
      '</div>'+
      (l.expenses.length ? '<table class="expense-table" style="margin-top:12px;"><thead><tr><th>成员</th><th>应付</th><th>状态</th></tr></thead><tbody>'+rows+'</tbody></table>' : '')+
    '</div>';
  }

  /* ---------------- modal (feed detail) ---------------- */
  function openModal(html){
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.id = 'activeOverlay';
    ov.onclick = function(e){ if(e.target===ov) closeModal(); };
    ov.innerHTML = '<div class="modal">'+html+'</div>';
    document.body.appendChild(ov);
  }
  function closeModal(){
    var ov = document.getElementById('activeOverlay');
    if(ov) ov.remove();
  }

  function listingDetailHtml(l){
    var s = statusOf(l);
    var iAmIn = l.participants.some(function(p){return p.name==="我";});
    var iPending = l.pending.some(function(p){return p.name==="我";});
    var iWaitlisted = l.waitlist.some(function(p){return p.name==="我";});
    var isFull = s==='full';
    var isMine = l.creator==='我';

    var actionHtml;
    if(isMine){
      actionHtml = '<div class="f-hint">这是你发起的拼场，去"我的拼场"里管理申请。</div>';
    } else if(iAmIn){
      actionHtml = '<div class="f-hint">✓ 你已加入，行程详情见"我的拼场"。</div>';
    } else if(iPending){
      actionHtml = '<div class="f-hint">⏳ 申请已提交，等待发起人审核。</div>';
    } else if(iWaitlisted){
      actionHtml = '<div class="f-hint">📋 你在候补队列中，有人退出会自动通知你。</div>';
    } else if(isFull){
      actionHtml = '<button class="btn ghost block" onclick="App.joinWaitlist(\''+l.id+'\')">加入候补队列</button>';
    } else {
      actionHtml = '<div class="f-row"><label>给发起人留句话</label><textarea id="applyNote" placeholder="介绍一下自己，或者说说为什么想一起去～"></textarea></div>'+
        '<button class="btn primary block" onclick="App.apply(\''+l.id+'\')">'+(l.reviewMode==='auto'?'立即加入':'提交申请')+'</button>';
    }

    return '<button class="modal-close" onclick="App.closeModal()">✕</button>'+
      '<span class="cat-tag">'+l.category+'</span>'+
      '<h3 style="margin-top:10px;">'+l.title+'</h3>'+
      '<div class="sub">发起人 '+l.creator+' · '+(l.reviewMode==='auto'?'自动通过':'发起人审核')+' · '+statusLabel(s)+'</div>'+
      '<div class="detail-grid">'+
        '<div class="detail-field"><label>集合时间</label><div>'+l.time+'</div></div>'+
        '<div class="detail-field"><label>集合地点</label><div>'+l.meet+'</div></div>'+
        '<div class="detail-field"><label>团队人数</label><div>'+approvedCount(l)+' / '+l.maxCap+' 人</div></div>'+
        '<div class="detail-field"><label>人均预算</label><div>'+fmtMoney(l.budgetMin,l.budgetMax)+'</div></div>'+
      '</div>'+
      (l.note ? '<p style="font-size:13px; color:var(--ink-soft); margin-bottom:14px;">'+l.note+'</p>' : '')+
      '<div class="participant-list">'+ l.participants.map(function(p){
        return '<div class="p-pill"><span class="av-sm" style="background:'+avColor(p.name)+'; margin-left:0;">'+initials(p.name)+'</span>'+p.name+'</div>';
      }).join('') + (l.waitlist.length ? '<div class="p-pill" style="color:var(--ink-soft);">+'+l.waitlist.length+' 候补</div>' : '') +'</div>'+
      actionHtml;
  }

  /* ---------------- profile modal ---------------- */
  function profileHtml(){
    var completed = state.footprints.length;
    return '<button class="modal-close" onclick="App.closeModal()">✕</button>'+
      '<div style="display:flex; align-items:center; gap:12px; margin-bottom:6px;">'+
        '<div class="avatar" style="width:46px;height:46px;font-size:16px;background:var(--coral);">我</div>'+
        '<div><h3>我</h3><div class="sub">Lv.'+state.lv+' 探索者</div></div>'+
      '</div>'+
      '<div class="detail-grid" style="margin-top:16px;">'+
        '<div class="detail-field"><label>身份认证</label><div style="color:var(--trail);">同校认证 ✓</div></div>'+
        '<div class="detail-field"><label>已成团次数</label><div>'+completed+' 次</div></div>'+
        '<div class="detail-field"><label>好评率</label><div>100%</div></div>'+
        '<div class="detail-field"><label>信用状态</label><div style="color:var(--trail);">良好</div></div>'+
      '</div>'+
      '<p class="f-hint" style="margin-top:14px;">互评、身份认证与举报机制共同构成信任分——这是组队型产品的安全底线。</p>';
  }

  /* ---------------- App (public actions) ---------------- */
  window.App = {
    switchTab: function(t){ ui.tab = t; render(); window.scrollTo({top:0,behavior:'smooth'}); },
    setCat: function(c){ ui.cat = c; render(); },
    render: render,
    closeModal: closeModal,

    openListing: function(id){
      var l = state.listings.find(function(x){return x.id===id;});
      if(!l) return;
      openModal(listingDetailHtml(l));
    },

    openProfile: function(){ openModal(profileHtml()); },

    apply: function(id){
      var l = state.listings.find(function(x){return x.id===id;});
      var note = (document.getElementById('applyNote')||{}).value || "";
      if(l.reviewMode === 'auto'){
        l.participants.push({name:"我"});
        toast('已加入「'+l.title+'」！');
      } else {
        l.pending.push({name:"我", note: note || "希望能一起参加～"});
        toast('申请已提交，等待发起人审核');
      }
      closeModal();
      persistAndRender();
    },

    joinWaitlist: function(id){
      var l = state.listings.find(function(x){return x.id===id;});
      l.waitlist.push({name:"我", note:"候补报名"});
      toast('已加入候补队列，有人退出会第一时间通知你');
      closeModal();
      persistAndRender();
    },

    approve: function(id, idx){
      var l = state.listings.find(function(x){return x.id===id;});
      var p = l.pending.splice(idx,1)[0];
      l.participants.push({name:p.name});
      toast('已通过 '+p.name+' 的申请');
      persistAndRender();
    },
    reject: function(id, idx){
      var l = state.listings.find(function(x){return x.id===id;});
      var p = l.pending.splice(idx,1)[0];
      toast('已婉拒 '+p.name+' 的申请');
      persistAndRender();
    },

    toggleMine: function(id){
      ui.openMine[id] = !ui.openMine[id];
      render();
    },

    addExpense: function(id){
      var item = document.getElementById('exp-item-'+id).value.trim();
      var amt = Number(document.getElementById('exp-amt-'+id).value);
      var payer = document.getElementById('exp-payer-'+id).value;
      if(!item || !amt){ toast('填写项目和金额后再记账'); return; }
      var l = state.listings.find(function(x){return x.id===id;});
      l.expenses.push({item:item, amount:amt, payer:payer});
      toast('已记一笔：'+item+' ¥'+amt);
      ui.openMine[id] = true;
      persistAndRender();
    },
    togglePaid: function(id, name){
      var l = state.listings.find(function(x){return x.id===id;});
      l.paid[name] = !l.paid[name];
      ui.openMine[id] = true;
      persistAndRender();
    },

    completeListing: function(id){
      var l = state.listings.find(function(x){return x.id===id;});
      l.done = true;
      state.footprints.push({title:l.title, caption:"完成打卡", withNames:l.participants.filter(function(p){return p.name!=="我";}).map(function(p){return p.name;})});
      state.lv = 1 + state.footprints.length;
      toast('已打卡「'+l.title+'」，探索等级 Lv.'+state.lv+' 🎉');
      ui.openMine[id] = true;
      persistAndRender();
    },

    handleCreate: function(ev){
      ev.preventDefault();
      var f = ev.target;
      var fd = new FormData(f);
      var minCap = Number(fd.get('minCap')), maxCap = Number(fd.get('maxCap'));
      var bMin = Number(fd.get('budgetMin')), bMax = Number(fd.get('budgetMax'));
      if(maxCap < minCap){ toast('人数上限不能小于最少成团人数'); return false; }
      if(bMax < bMin){ toast('预算上限不能小于预算下限'); return false; }
      var l = {
        id: uid(), creator:"我", title: fd.get('title'), category: fd.get('category'),
        time: fd.get('time'), meet: fd.get('meet'), minCap:minCap, maxCap:maxCap,
        budgetMin:bMin, budgetMax:bMax, reviewMode: fd.get('reviewMode'),
        weather:"天气待更新", distance:0, note: fd.get('note') || "",
        participants:[{name:"我", role:"creator"}], pending:[], waitlist:[], expenses:[], paid:{}, done:false
      };
      state.listings.unshift(l);
      f.reset();
      document.querySelectorAll('.review-opt').forEach(function(o){o.classList.toggle('selected', o.dataset.val==='auto');});
      toast('拼场卡已生成，快去邀请同行的人吧');
      ui.tab = 'mine';
      ui.openMine[l.id] = true;
      persistAndRender();
      return false;
    }
  };

  // review toggle UI
  document.addEventListener('click', function(e){
    var opt = e.target.closest('.review-opt');
    if(opt){
      document.querySelectorAll('.review-opt').forEach(function(o){o.classList.remove('selected');});
      opt.classList.add('selected');
      opt.querySelector('input').checked = true;
    }
  });

  render();
})();
</script>
